# Deploys this example to Locally the same way its README does, then tears it
# down again - so a change that stops the example deploying fails its PR.
name: Locally

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: locally-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  deploy:
    name: Deploy to Locally
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write # required: Locally signs in using GitHub's OIDC token
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_wrapper: false

      # The containerd image store in the runner's Docker version ignores
      # /etc/docker/certs.d when fetching a registry's OAuth token, so the push
      # fails with "x509: certificate signed by unknown authority" even though
      # the CA is trusted for the registry itself (moby/moby c2075797). The
      # classic image store uses the registry's TLS settings for both, so
      # switch to it. This restarts Docker, so it has to happen before Locally
      # starts any containers. Remove once the runner image ships Docker
      # 29.9.0 or later: https://github.com/actions/runner-images/issues/15330
      - name: Use Docker's classic image store
        run: |
          set -euo pipefail
          config=/etc/docker/daemon.json
          current="$(sudo cat "$config" 2>/dev/null || echo '{}')"
          jq '.features["containerd-snapshotter"] = false' <<<"$current" | sudo tee "$config" >/dev/null
          sudo systemctl restart docker
          docker version --format 'Docker {{.Server.Version}}'
          docker info --format 'Storage driver: {{.Driver}}'

      - uses: locallybuild/setup-locally@v1
        with:
          team-uuid: ${{ vars.LOCALLY_TEAM_UUID }}
          plugins: custom
          plugins-list: |
            Microsoft.ContainerRegistry
            Microsoft.DBforMySQL
            Microsoft.Insights
            Microsoft.OperationalInsights
            Microsoft.Web

      - name: Apply environments/locally
        id: apply0
        working-directory: environments/locally
        run: |
          set -euo pipefail
          terraform init -input=false

          # The runner's trust store doesn't hold the CA setup-locally
          # generated, so Docker is told to trust it for the registry before
          # the image is pushed. The registry's name isn't known until it
          # exists, so it's created first, on its own.
          locally run terraform apply -auto-approve -input=false \
            -target=module.app-service-mysql.azurerm_container_registry.main
          registry="$(locally run az acr list --query '[0].loginServer' --output tsv)"
          sudo mkdir -p "/etc/docker/certs.d/$registry"
          sudo cp "$LOCALLY_TLS_CA_FILE_PATH" "/etc/docker/certs.d/$registry/ca.crt"

          locally run terraform apply -auto-approve -input=false

      - name: Destroy environments/locally
        # Only once there's something to destroy.
        if: always() && steps.apply0.outcome != 'skipped'
        working-directory: environments/locally
        run: locally run terraform destroy -auto-approve -input=false

      - uses: locallybuild/setup-locally/teardown@v1
        if: always()
